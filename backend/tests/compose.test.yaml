name: ai-shopping-analyzer-tests

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_shopping_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_shopping_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:8-alpine
    ports:
      - "46379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
