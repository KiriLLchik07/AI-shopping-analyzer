services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-shopping-analyzer-postgres
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - ./infra/postgres/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ai-shopping-analyzer-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: ai-shopping-analyzer-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ./infra/minio/minio.env
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./infra/minio/minio.env
    volumes:
      - ./infra/minio/init_bucket.sh:/scripts/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-bucket.sh"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
