services:
  postgres:
    container_name: ai-shopping-frontend-smoke-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_shopping_test
    ports: !override ["127.0.0.1:55434:5432"]
  redis:
    container_name: ai-shopping-frontend-smoke-redis
    ports: !override ["127.0.0.1:46381:6379"]
  minio:
    container_name: ai-shopping-frontend-smoke-minio
    environment:
      MINIO_ROOT_USER: smoke-user
      MINIO_ROOT_PASSWORD: smoke-password-only
      MINIO_BUCKET: receipts
    ports: !override ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
  minio-init:
    environment:
      MINIO_ROOT_USER: smoke-user
      MINIO_ROOT_PASSWORD: smoke-password-only
      MINIO_BUCKET: receipts
  backend:
    environment: &smoke-environment
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_shopping_test
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://127.0.0.1:19000
      MINIO_ROOT_USER: smoke-user
      MINIO_ROOT_PASSWORD: smoke-password-only
      MINIO_BUCKET: receipts
      COOKIE_SECURE: "false"
    ports: !override ["127.0.0.1:8001:8000"]
  worker:
    environment:
      <<: *smoke-environment
      IMAGE_ORIENTATION_DEVICE: cpu
      IMAGE_ORIENTATION_MODEL_DIR: /models/doc-orientation
      OCR_DEVICE: cpu
      OCR_MODEL_DIR: /models/ocr
  frontend:
    ports: !override ["127.0.0.1:5184:8080"]
